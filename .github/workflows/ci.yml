name: Corporate site CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run content, brand, type, build and static-export checks
        run: npm run check

      - name: Start exported site
        run: |
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out > /tmp/istriade-static.log 2>&1 &
          echo $! > /tmp/istriade-static.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/istriade-static.log
          exit 1

      - name: Static HTTP smoke tests
        run: |
          set -euo pipefail
          for path in / /about/ /products/ /capabilities/ /approach/ /contact/ /legal/ /privacy/ /terms/ /robots.txt /sitemap.xml; do
            code="$(curl -sS -o /tmp/istriade-body -w '%{http_code}' "http://127.0.0.1:3000${path}")"
            test "$code" = "200" || { echo "$path returned $code"; exit 1; }
          done
          test -f out/404.html
          grep -q 'Page not found' out/404.html
          grep -q 'Sitemap: https://istriadegroup.com/sitemap.xml' out/robots.txt
          grep -q 'https://istriadegroup.com/about/' out/sitemap.xml
          ! grep -q 'href="https://sygvana.com' out/index.html
          ! grep -q 'href="https://irmya.com' out/index.html

      - name: Install Chromium for private visual QA
        run: npx -y playwright@1.62.1 install --with-deps chromium

      - name: Capture private QA screenshots
        run: |
          mkdir -p visual-artifacts
          npx -y playwright@1.62.1 screenshot --browser=chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:3000/ visual-artifacts/home-desktop.png
          npx -y playwright@1.62.1 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:3000/ visual-artifacts/home-mobile.png
          npx -y playwright@1.62.1 screenshot --browser=chromium --viewport-size="1440,1000" --full-page http://127.0.0.1:3000/products/ visual-artifacts/products-desktop.png

      - name: Package Cloudflare static deployment
        env:
          SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p deployment-artifacts
          (cd out && zip -qr ../deployment-artifacts/istriade-cloudflare-static-v1.zip .)
          sha256sum deployment-artifacts/istriade-cloudflare-static-v1.zip > deployment-artifacts/istriade-cloudflare-static-v1.zip.sha256
          printf '%s\n' "$SOURCE_COMMIT" > deployment-artifacts/source-commit.txt

      - name: Upload private visual QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: corporate-site-visual-qa
          path: visual-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Cloudflare deployment package
        uses: actions/upload-artifact@v4
        with:
          name: istriade-cloudflare-static-v1
          path: deployment-artifacts/
          if-no-files-found: error
          retention-days: 14
