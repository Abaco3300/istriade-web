name: Deploy ISTRIADE corporate site to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: istriade-corporate-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: 4.129.0
      WORKER_NAME: tiny-pond-1463
      LIVE_ORIGIN: https://istriadegroup.com

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild and verify approved static site
        run: npm run check

      - name: Validate Wrangler production configuration
        run: npx --yes wrangler@${WRANGLER_VERSION} deploy --dry-run --outdir /tmp/istriade-wrangler-dry-run

      - name: Capture pre-deploy Cloudflare state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          printf '%s\n' "$GITHUB_SHA" > deployment-evidence/source-commit.txt
          npx --yes wrangler@${WRANGLER_VERSION} deployments status --name "$WORKER_NAME" --json > deployment-evidence/before-deploy.json

      - name: Deploy verified static assets to existing Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deploy --message "ISTRIADE corporate v1 from ${GITHUB_SHA}" 2>&1 | tee deployment-evidence/deploy-output.txt

      - name: Verify live production
        id: live_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          expected='We build intelligent products for real business operations.'
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$LIVE_ORIGIN/" | grep -Fq "$expected"; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1" || { echo "New homepage did not become visible"; exit 1; }

          for path in / /about/ /products/ /capabilities/ /approach/ /contact/ /legal/ /privacy/ /terms/ /commercial-policies/ /robots.txt /sitemap.xml; do
            path_ready=0
            for attempt in $(seq 1 20); do
              code="$(curl -sSL -H 'Cache-Control: no-cache' -o /tmp/istriade-live-body -w '%{http_code}' --max-time 15 "$LIVE_ORIGIN${path}")"
              if [ "$code" = "200" ]; then
                path_ready=1
                break
              fi
              echo "$path returned $code on attempt $attempt/20; retrying"
              sleep 2
            done
            test "$path_ready" = "1" || { echo "$path did not reach HTTP 200 within the propagation window"; exit 1; }
          done

          missing_code="$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/istriade-live-404 -w '%{http_code}' --max-time 15 "$LIVE_ORIGIN/definitely-missing-page/")"
          test "$missing_code" = "404" || { echo "Expected live 404, got $missing_code"; exit 1; }
          grep -Fq 'Page not found' /tmp/istriade-live-404

          redirect_headers="$(curl -sSI -H 'Cache-Control: no-cache' --max-time 15 "$LIVE_ORIGIN/company" | tr -d '\r')"
          printf '%s\n' "$redirect_headers" | grep -Eq '^HTTP/[^ ]+ 301'
          printf '%s\n' "$redirect_headers" | grep -Eqi '^location: .*/about/?$'

          refund_redirect_headers="$(curl -sSI -H 'Cache-Control: no-cache' --max-time 15 "$LIVE_ORIGIN/refund-policy" | tr -d '\r')"
          printf '%s\n' "$refund_redirect_headers" | grep -Eq '^HTTP/[^ ]+ 301'
          printf '%s\n' "$refund_redirect_headers" | grep -Eqi '^location: .*/commercial-policies/?$'

          home_headers="$(curl -sSI -H 'Cache-Control: no-cache' --max-time 15 "$LIVE_ORIGIN/" | tr -d '\r')"
          printf '%s\n' "$home_headers" | grep -Eqi '^x-content-type-options: nosniff$'
          printf '%s\n' "$home_headers" | grep -Eqi '^referrer-policy: strict-origin-when-cross-origin$'

          curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "$LIVE_ORIGIN/robots.txt" | grep -Fq 'Sitemap: https://istriadegroup.com/sitemap.xml'
          curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "$LIVE_ORIGIN/sitemap.xml" | grep -Fq 'https://istriadegroup.com/about/'
          curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "$LIVE_ORIGIN/sitemap.xml" | grep -Fq 'https://istriadegroup.com/commercial-policies/'

          live_home="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "$LIVE_ORIGIN/")"
          ! printf '%s' "$live_home" | grep -q 'href="https://sygvana.com'
          ! printf '%s' "$live_home" | grep -q 'href="https://irmya.com'

          live_commercial="$(curl -fsSL -H 'Cache-Control: no-cache' --max-time 15 "$LIVE_ORIGIN/commercial-policies/")"
          printf '%s' "$live_commercial" | grep -Fq 'Refunds'
          printf '%s' "$live_commercial" | grep -Fq 'Subscription and Recurring-Service Cancellations'
          printf '%s' "$live_commercial" | grep -Fq 'USD'
          printf '%s' "$live_commercial" | grep -Fq 'contact@istriadegroup.com'

          printf '%s\n' "LIVE_SMOKE=PASS" > deployment-evidence/live-smoke.txt

      - name: Automatic rollback if live verification fails
        if: steps.live_smoke.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "Live verification failed. Rolling back to the previously deployed Worker version."
          npx --yes wrangler@${WRANGLER_VERSION} rollback --name "$WORKER_NAME" --message "Automatic rollback after failed ISTRIADE live verification for ${GITHUB_SHA}" 2>&1 | tee deployment-evidence/rollback-output.txt
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /tmp/istriade-rollback-home -w '%{http_code}' --max-time 15 "$LIVE_ORIGIN/" || true)"
            if [ "$code" = "200" ]; then
              printf '%s\n' "ROLLBACK_HOME_HTTP=200" > deployment-evidence/rollback-verification.txt
              break
            fi
            sleep 2
          done

      - name: Fail workflow after automatic rollback
        if: steps.live_smoke.outcome == 'failure'
        run: |
          echo "Production verification failed and rollback was invoked."
          exit 1

      - name: Capture verified post-deploy Cloudflare state
        if: steps.live_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deployments status --name "$WORKER_NAME" --json > deployment-evidence/after-deploy.json
          printf '%s\n' "PRODUCTION_VERIFICATION=PASS" > deployment-evidence/result.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istriade-production-deployment-evidence
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 30
